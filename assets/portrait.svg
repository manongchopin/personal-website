<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="肖像占位图：待替换为照片">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#f3ecdd"/>
      <stop offset="0.55" stop-color="#e9dfcc"/>
      <stop offset="1" stop-color="#ddcfb8"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0" stop-color="#fffaf0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fffaf0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grain" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.6" fill="#4a3f31" opacity="0.18"/>
      <circle cx="4" cy="3" r="0.5" fill="#4a3f31" opacity="0.12"/>
    </pattern>
  </defs>

  <rect width="800" height="1000" fill="url(#paper)"/>
  <rect width="800" height="1000" fill="url(#vignette)"/>

  <!-- 等高线：田野与地图的暗示，不是照片 -->
  <g fill="none" stroke="#8a3b2c" stroke-width="1.2" opacity="0.16">
    <path d="M-20 780 C 120 700, 210 820, 340 760 S 560 660, 820 740"/>
    <path d="M-20 820 C 130 742, 220 858, 350 800 S 570 702, 820 782"/>
    <path d="M-20 860 C 140 786, 228 894, 360 840 S 580 746, 820 824"/>
    <path d="M-20 900 C 150 830, 236 930, 370 880 S 590 790, 820 866"/>
    <path d="M-20 940 C 160 874, 244 966, 380 920 S 600 834, 820 908"/>
    <path d="M-20 620 C 100 560, 190 650, 300 610 S 520 520, 820 590"/>
    <path d="M-20 580 C 110 522, 196 610, 310 572 S 530 484, 820 552"/>
  </g>

  <rect x="28" y="28" width="744" height="944" fill="none" stroke="#b6a68e" stroke-width="1" opacity="0.65"/>

  <!-- 四角刻度 -->
  <g stroke="#8a3b2c" stroke-width="1.5" opacity="0.55">
    <path d="M28 52 V28 H52"/>
    <path d="M748 28 H772 V52"/>
    <path d="M772 948 V972 H748"/>
    <path d="M52 972 H28 V948"/>
  </g>

  <text x="400" y="608" text-anchor="middle"
        font-family="'Songti SC','Noto Serif CJK SC','Source Han Serif SC',Georgia,serif"
        font-size="320" fill="#2b251e" opacity="0.86">余</text>

  <text x="52" y="64" font-family="ui-monospace,Menlo,monospace"
        font-size="13" letter-spacing="5" fill="#6d6559" opacity="0.85">NTU · ANTHROPOLOGY</text>

  <text x="52" y="944" font-family="ui-monospace,Menlo,monospace"
        font-size="13" letter-spacing="4" fill="#6d6559" opacity="0.9">PORTRAIT / 待替换</text>

  <text x="748" y="944" text-anchor="end" font-family="ui-monospace,Menlo,monospace"
        font-size="13" letter-spacing="4" fill="#6d6559" opacity="0.6">4 : 5</text>

  <rect width="800" height="1000" fill="url(#grain)" opacity="0.5"/>
</svg>
